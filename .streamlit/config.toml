[theme]
primaryColor = "#003c52"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f8f9"
textColor = "#1f2430"
font = "sans serif"
baseFontSize = 15
baseRadius = "0.55rem"
borderColor = "#e2e8eb"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#eef4f6"
linkColor = "#0092a6"
# QDB template colours: navy, teal, sky, lime, burgundy, orange
chartCategoricalColors = ["#003c52", "#0092a6", "#00a3eb", "#93ca15", "#8b153c",
                          "#ff4a00", "#7fc8d2", "#8a94a6"]

[client]
# No Deploy button or developer menu: this is an application, not a notebook.
toolbarMode = "minimal"

[server]
headless = true
runOnSave = true
maxUploadSize = 500

[browser]
gatherUsageStats = false
